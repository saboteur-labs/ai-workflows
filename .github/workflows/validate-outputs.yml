name: Validate output schemas

on:
    pull_request:
        paths:
            - "schemas/**"
            - "prompts/**/*.md"
            # A schema may declare `skill:` instead of `prompt:`, which makes a
            # SKILL.md the authored format the drift check reads. Without this
            # line, editing that section cannot trigger the check that governs it.
            - "skills/**/SKILL.md"
            - "tools/lib/check-outputs.js"
            - "tools/lib/check_outputs.sh"

jobs:
    outputs:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: "20"

            - name: Run output schema check
              run: |
                  chmod +x tools/lib/check_outputs.sh
                  bash tools/lib/check_outputs.sh
