name: Validate placeholders

on:
    pull_request:
        paths:
            - "prompts/**/*.md"
            - "skills/**/SKILL.md"
            - "guides/**/*.md"
            - "examples/**/*.md"

jobs:
    placeholders:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Run placeholder check
              run: |
                  chmod +x tools/lib/check_placeholders.sh
                  bash tools/lib/check_placeholders.sh
