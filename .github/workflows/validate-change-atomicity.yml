name: Validate change atomicity

on:
    pull_request:
        paths:
            - "prompts/**"
            - "skills/**"
            - "guides/**"
            - "examples/**"
            - "tools/**"
            - "templates/**"
            - "CHANGELOG.md"
            - "README.md"
            - "CONTRIBUTING.md"
            - "AGENTS.md"

jobs:
    atomicity:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Get changed files
              run: |
                  git diff --name-only origin/${{ github.base_ref }}...HEAD \
                    > /tmp/changed_files.txt
                  echo "Changed files:"
                  cat /tmp/changed_files.txt

            - name: Run atomicity check
              run: |
                  chmod +x tools/lib/check_atomicity.sh
                  CHANGED_FILES_PATH=/tmp/changed_files.txt bash tools/lib/check_atomicity.sh
