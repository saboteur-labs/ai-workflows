name: Validate frontmatter

on:
    pull_request:
        paths:
            - "prompts/**/*.md"
            - "skills/**/SKILL.md"

jobs:
    validate:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Run frontmatter check
              run: |
                  chmod +x tools/lib/check_frontmatter.sh
                  bash tools/lib/check_frontmatter.sh
